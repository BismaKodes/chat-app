<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Time Chat App</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="title">Real Time Chat App</h1>

    <div class="phones">

        <!-- ========================= -->
        <!-- PHONE 1 -->
        <!-- ========================= -->

        <div class="phone">

            <div class="notch"></div>

            <!-- AUTH SCREEN -->

            <div id="authScreenUser1" class="authScreen">

                <h2 id="authTitleUser1">Login</h2>

                <input
                    type="text"
                    id="usernameUser1"
                    placeholder="Username"
                    class="hidden"
                >

                <input
                    type="email"
                    id="emailUser1"
                    placeholder="Email"
                >

                <input
                    type="password"
                    id="passwordUser1"
                    placeholder="Password"
                >

                <button id="authBtnUser1">
                    Login
                </button>

                <p>

                    <span id="authTextUser1">
                        Don't have an account?
                    </span>

                    <a href="#" id="toggleAuthUser1">
                        Sign Up
                    </a>

                </p>

            </div>


            <!-- CHAT SCREEN -->

            <div id="chatScreenUser1" class="chatScreen hidden">

                <div class="chatHeader">

                    <div>

                        <h3 id="userNameDisplay1">
                            User 1
                        </h3>

                        <small id="statusUser1">
                            ⚪ Offline
                        </small>

                    </div>

                    <button id="logoutBtnUser1">
                        Logout
                    </button>

                </div>


                <div
                    class="messages"
                    id="messagesUser1"
                >

                </div>


                <div
                    class="typing"
                    id="typingUser1"
                >

                </div>


                <div class="messageInput">

                    <input
                        type="text"
                        id="messageUser1"
                        placeholder="Type a message..."
                    >

                    <button id="sendBtnUser1">
                        Send
                    </button>

                </div>

            </div>

        </div>





        <!-- ========================= -->
        <!-- PHONE 2 -->
        <!-- ========================= -->

        <div class="phone">

            <div class="notch"></div>

            <!-- AUTH SCREEN -->

            <div id="authScreenUser2" class="authScreen">

                <h2 id="authTitleUser2">Login</h2>

                <input
                    type="text"
                    id="usernameUser2"
                    placeholder="Username"
                    class="hidden"
                >

                <input
                    type="email"
                    id="emailUser2"
                    placeholder="Email"
                >

                <input
                    type="password"
                    id="passwordUser2"
                    placeholder="Password"
                >

                <button id="authBtnUser2">
                    Login
                </button>

                <p>

                    <span id="authTextUser2">
                        Don't have an account?
                    </span>

                    <a href="#" id="toggleAuthUser2">
                        Sign Up
                    </a>

                </p>

            </div>


            <!-- CHAT SCREEN -->

            <div id="chatScreenUser2" class="chatScreen hidden">

                <div class="chatHeader">

                    <div>

                        <h3 id="userNameDisplay2">
                            User 2
                        </h3>

                        <small id="statusUser2">
                            ⚪ Offline
                        </small>

                    </div>

                    <button id="logoutBtnUser2">
                        Logout
                    </button>

                </div>


                <div
                    class="messages"
                    id="messagesUser2"
                >

                </div>


                <div
                    class="typing"
                    id="typingUser2"
                >

                </div>


                <div class="messageInput">

                    <input
                        type="text"
                        id="messageUser2"
                        placeholder="Type a message..."
                    >

                    <button id="sendBtnUser2">
                        Send
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/socket.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/ui.js"></script>

</body>
</html>
